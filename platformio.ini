; ESP32-S3-WROOM-1 N16R8 Web Radio
; - 16MB Flash, 8MB Octal PSRAM
; - MAX98357A I2S amp + ST7789V SPI TFT (240x320 rotated 320x240)
; - 2 buttons with long-press + simultaneous-hold control

[env:esp32-s3-n16r8]
platform = espressif32@^6.6.0          ; Arduino-ESP32 2.0.14 (ESP-IDF 4.4)
board = esp32-s3-devkitc-1
framework = arduino

; ---- N16R8 memory configuration -----------------------------------------
; Flash mode is "dio" because the bootloader log on this board shows
; "mode:DIO". If your board prints "mode:QIO" instead, change both
; memory_type to "qio_opi" and flash_mode to "qio" for ~30% faster reads.
; PSRAM is Octal on N16R8 regardless of flash mode (the "_opi" suffix).
board_build.arduino.memory_type = dio_opi
board_build.flash_mode          = dio
board_build.partitions          = partitions_16MB.csv
board_upload.flash_size         = 16MB
board_build.f_flash             = 80000000L
board_build.f_cpu               = 240000000L

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600

; ---- C++17 is required by ESP32-audioI2S 3.x ----------------------------
build_unflags = -std=gnu++11
build_flags =
  -DARDUINO_USB_CDC_ON_BOOT=0    ; 0 = boots immediately on power-on
                                  ; (set to 1 only when you need a USB
                                  ; serial monitor; that requires
                                  ; pressing reset once on power-up).
  -DARDUINO_USB_MODE=1           ; pure USB-OTG hardware mode -- skips
                                  ; the boot-time HWCDC host check.
  -DARDUINO_USB_DFU_ON_BOOT=0    ; don't wait for a DFU host either.
  -DCORE_DEBUG_LEVEL=2
  -DBOARD_HAS_PSRAM
  -DCONFIG_ASYNC_TCP_USE_WDT=0
  -DU8G2_USE_LARGE_FONTS=1    ; D2Coding 24px Hangul font is 634 KB (> 64 KB)
                              ; so u8g2 needs 24-bit glyph indices.
  -std=gnu++17

; ---- Libraries ----------------------------------------------------------
; ESP32-audioI2S is pinned to 3.0.12 because newer 3.1+ versions require
; Arduino-ESP32 3.x (ESP-IDF 5.x) and the I2S v2 API. With
; espressif32@^6.6.0 (Arduino 2.0.14), 3.0.12 is the last compatible tag.
; Full tag list: https://github.com/schreibfaul1/ESP32-audioI2S/tags
;
; Adafruit ships ST7789 inside the combined ST7735+ST7789 package -- there
; is no standalone "Adafruit ST7789" package in the PlatformIO registry.
lib_deps =
  https://github.com/schreibfaul1/ESP32-audioI2S.git#3.0.12
  adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.4
  adafruit/Adafruit GFX Library @ ^1.11.5
  adafruit/Adafruit BusIO @ ^1.16.1
  olikraus/U8g2_for_Adafruit_GFX @ ^1.8.0   ; Korean fonts (unifont_t_korean1)
  knolleary/PubSubClient@^2.8                ; MQTT (Home Assistant integration)
